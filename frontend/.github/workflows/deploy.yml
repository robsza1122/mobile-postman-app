name: Deploy Vite site to Pages

on:
  push:
    branches: ["develop"] # Zmień na master, jeśli takiej używasz

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './package-lock.json' # Ścieżka do locka

      - name: Install dependencies
        run: npm install
        working-directory: ./frontend # WCHODZIMY DO FOLDERU

      - name: Build
        run: npm run build
        working-directory: ./frontend # WCHODZIMY DO FOLDERU

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist' # ŚCIEŻKA DO ZBUDOWANEGO PROJEKTU
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4